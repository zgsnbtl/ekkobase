# Docker Compose 配置
# 注意：version 字段已废弃，但保留以确保兼容性

networks:
  nocobase:
    driver: bridge

services:
  app:
    image: registry.cn-shanghai.aliyuncs.com/nocobase/nocobase:latest-full
    restart: always
    networks:
      - nocobase
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 应用的密钥，用于生成用户 token 等
      # 如果 APP_KEY 修改了，旧的 token 也会随之失效
      # 可以是任意随机字符串，并确保不对外泄露
      - APP_KEY=${APP_KEY:-your-secret-key-change-this}
      
      # 数据库类型，支持 postgres, mysql, mariadb, sqlite
      - DB_DIALECT=mysql
      # 数据库主机，可以替换为已有的数据库服务器 IP
      - DB_HOST=${DB_HOST:-mysql}
      # Database port
      - DB_PORT=${DB_PORT:-3306}
      # 数据库名
      - DB_DATABASE=${DB_DATABASE:-nocobase}
      # 数据库用户
      - DB_USER=${DB_USER:-nocobase}
      # 数据库密码
      - DB_PASSWORD=${DB_PASSWORD}
      # 数据库表名、字段名是否转为 snake case 风格
      - DB_UNDERSCORED=${DB_UNDERSCORED:-true}
      # 时区
      - TZ=${TZ:-Asia/Shanghai}
      # 性能优化
      - NODE_ENV=${NODE_ENV:-production}
      - NODE_OPTIONS=--max-old-space-size=4096
    volumes:
      - ./storage:/app/nocobase/storage
      - ./logs:/app/nocobase/logs
    ports:
      - '${APP_PORT:-13000}:80'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # 如果使用已有数据库服务，可以不启动 mysql
  mysql:
    image: mysql:8.4.6
    container_name: ekkobase-mysql-1
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-nocobase}
      - MYSQL_USER=${DB_USER:-nocobase}
      - MYSQL_PASSWORD=${DB_PASSWORD:-nocobase}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-nocobase}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-production.cnf:/etc/mysql/conf.d/mysql.cnf:ro
    ports:
      - "${DB_PORT:-3306}:3306"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD:-nocobase} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ./storage/redis:/data
    networks:
      - nocobase
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  mysql_data:
    driver: local